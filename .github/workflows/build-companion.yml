name: build-companion-exe
on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: companion
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt
          python -m PyInstaller --onefile --noconsole --name PromptForgeCompanion --hidden-import pystray._win32 app.py
      - uses: actions/upload-artifact@v4
        with:
          name: PromptForgeCompanion
          path: companion/dist/PromptForgeCompanion.exe
